services:
  notarius-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54331}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        SUPABASE_COOKIE_SECURE: ${SUPABASE_COOKIE_SECURE:-false}
    container_name: notarius-web
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54331}
      SUPABASE_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_COOKIE_SECURE: ${SUPABASE_COOKIE_SECURE:-false}
      NUXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54331}
      NUXT_PUBLIC_SUPABASE_KEY: ${SUPABASE_ANON_KEY}
      NUXT_SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NUXT_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-Password123!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
